name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Lint and format
        run: |
          ruff check backend
          ruff format --check backend
      - name: Test
        run: pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, format and typecheck
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck
      - name: Build
        run: pnpm build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up --build -d --wait
      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health | grep '"database":"up"'
          curl --fail --silent --show-error http://127.0.0.1:3000/ | grep 'Atendimento sem perder o contexto'
          curl --fail --silent --show-error --cookie-jar /tmp/lanternqueue.cookies \
            --header 'content-type: application/json' \
            --data '{"email":"marina@example.test","password":"lanternqueue-demo-2026"}' \
            http://127.0.0.1:3000/api/v1/sessions | grep 'marina@example.test'
          curl --fail --silent --show-error --cookie /tmp/lanternqueue.cookies \
            http://127.0.0.1:3000/api/v1/tickets | grep 'Notebook'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop stack
        if: always()
        run: docker compose down -v
